<html>
  <head>
    <title>Leaderboard</title>
  </head>
  <body>
    <h1>Leaderboard of {{ animal_name }} sightings</h1>

    <table>
      {% for user in result[:100] %}
      <tr>
        <td>{{ loop.index }}.</td>
        <td>{{ user }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
